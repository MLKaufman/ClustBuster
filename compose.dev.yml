services:
  clustbuster:
    build: .
    ports:
      - "8000:8000"
    environment:
      CLUSTBUSTER_LOG_LEVEL: INFO
      CLUSTBUSTER_MAX_UPLOAD_MB: 2048
      CLUSTBUSTER_ENABLE_SEURAT_IMPORT: 1
      CLUSTBUSTER_ENABLE_SCE_IMPORT: 1
    volumes:
      - gene-sets:/data/gene_sets
    tmpfs:
      # Shiny stages uploads in /tmp before ClustBuster copies them into the
      # session workspace. These limits accommodate the 1.9 GB stress fixture.
      - /workspace:size=8G,mode=1777
      - /tmp:size=3G,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  gene-sets:
