name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=clustbuster --cov-report=term-missing
      - run: docker build -t clustbuster:test .
      - run: scripts/container_smoke.sh clustbuster:test
