[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clustbuster"
version = "0.1.0"
description = "Assisted annotation of single-cell RNA-sequencing clusters"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "ClustBuster contributors" }]
dependencies = [
  "anndata>=0.11,<0.13",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "plotly>=6.0,<7",
  "scipy>=1.14,<2",
  "shiny>=1.4,<2",
  "shinywidgets>=0.5,<1",
]

[project.optional-dependencies]
analysis = ["scanpy>=1.11,<2"]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
clustbuster = "clustbuster.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clustbuster"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clustbuster"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "anndata",
  "anndata.*",
  "pandas",
  "pandas.*",
  "plotly",
  "plotly.*",
  "scipy",
  "scipy.*",
]
ignore_missing_imports = true
